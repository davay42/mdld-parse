# The Atlas Workbench {=w:workbench .w:Workbench label}

*An intention, written before any code: **a world that asks to be understood.** Explorers who know nothing, whose only senses are shapes.*

This document is the whole design. Four explorers walk a world they cannot see. Each carries a **worldview** — a set of SHACL shapes — and nothing else. The loop is the one this repository teaches, bent into a game:

1. **Perception is the evaluated record.** An explorer only commits a fact to memory if one of its shapes targets the subject *and* names the predicate. Scenery that no shape asks about never enters its mind.
2. **Violations are the work list.** A missing value (`sh:minCount`) is a task: *go where the answer lives*. A value the world contradicts is a *finding*, not a task — the shape, not the explorer, is wrong.
3. **Ontology first.** The first shapes cannot ask about places, because the explorer has no words for them. They ask for *definitions*: every class needs a label and a comment, and the atlas must define eight words. Only when those hold does the next stage unfold.
4. **Deepen by promotion.** Each stage is a dormant module below. When an explorer's own gate shape has enough complete records, the next module is appended to its worldview — append-only, never rewritten. Humans may edit any worldview at any moment; the gate does not care who wrote the shape.
5. **Collaboration is merging.** Explorers who meet exchange memories — but only facts that fit the *receiver's* lens. A Naturalist can hand a Prospector a map, never a vitality reading the Prospector has no shape for.

| Stage | Demands | Asks the world for | Unlocks |
|-------|---------|--------------------|---------|
| 0 — Vocabulary | every class has a label and a comment; atlas defines ≥ 8 words | *words*: terrain and feature kinds, learned by standing on an instance | the noticing of places |
| 1 — Places | every Feature is located and has richness 1–5; atlas holds ≥ 6 places | *instances*: where things are, how rich | role-specific depth |
| 2 — Depth | per role: vitality / grade / age, or wider extent (≥ 12 places) | *properties* that only a specialist has a word for | the shared view |
| 3 — Trails | every Feature knows ≥ 1 trail; atlas holds ≥ 20 places | *relations*: which places connect, revealing places never yet seen | the human's turn |

| Commons | the Charter: each viewpoint's standard for a shared place | *joins* — facts no one explorer can hold at once | a settlement: the world changes, and asks for new words |

**Beside the ladder runs the Commons.** It is a mind of its own, reading the union of everyone's memory through the Charter below. A *Site* is a living place with an ore and a relic nearby; the Charter says what each role needs before it will settle there. A site that lacks a measurement sends a *request* to whoever owns the word for it; a site that fails a standard is *unfit*; a site that satisfies everyone is *viable*, and the explorers gather to found it. A founding is a **shared consequence**: a Settlement appears in the world, so the ontology grows (new words to define) and explorers who share its market exchange memories.

**After stage 3 the shapes are yours.** Write a new shape in any worldview — say, every tile needs an `elevation`, or every Ruin must be near a Spring — and watch the explorer turn toward the work. A shape the world cannot answer shows up as a *blocked* task: the signal to tighten or loosen the shape, never to bypass the gate.

## The Explorers

Four roles, one shared ladder. The roles diverge only at stage 2, where each learns a word the others lack — so no single explorer can finish the atlas alone.

## Cartographer {=w:cartographer .w:Role label}
Reads the world as an extent: *how much of it is there?* Pulled outward by wide demands, so it finds places the others later specialise on.

## Naturalist {=w:naturalist .w:Role label}
Reads the world as a living system: springs, groves, herds. Wants their *vitality*.

## Prospector {=w:prospector .w:Role label}
Reads the world as a seam of resources: ore and caves. Wants their *grade*.

## Archivist {=w:archivist .w:Role label}
Reads the world as a record of people: ruins, shrines, wrecks. Wants their *age*.

## What the shapes do not yet say

Ideas left dormant on purpose — each would pull the explorers somewhere new. Paste one into any worldview and watch the tasks change:

- *Every Terrain tile has an `elevation`.* The explorer starts noticing tiles at all, and sweeps the map to survey them.
- *Every Ruin must `linkedTo` a Spring.* A relation the world mostly does not offer — a good way to see a **blocked** task.
- *Every `rdf:Property` has a `domain` and a `range`.* Ontology first, one level deeper: the vocabulary must describe its own predicates.

// ═════════════════════════ ENGINE: world, minds, commons ═════════════════════════

// Deterministic world + shape-driven explorers. No DOM, no Math.random, no Date.
// Reality is a pure function of the seed. An explorer is a pure function of
// (its worldview text, the facts it has perceived). Violations are its tasks.

const NS = 'tag:atlas.world,2026:'
const RDF = 'http://www.w3.org/1999/02/22-rdf-syntax-ns#'
const RDFS = 'http://www.w3.org/2000/01/rdf-schema#'
const XSD = 'http://www.w3.org/2001/XMLSchema#'
const SH = 'http://www.w3.org/ns/shacl#'
const TYPE = RDF + 'type', SUB = RDFS + 'subClassOf', LABEL = RDFS + 'label', COMMENT = RDFS + 'comment', CLASS = RDFS + 'Class'
const w = s => NS + s
const short = s => String(s).startsWith(NS) ? 'w:' + s.slice(NS.length) : String(s).replace(RDFS, 'rdfs:').replace(RDF, 'rdf:').replace(XSD, 'xsd:').replace(SH, 'sh:')
const SIGHT = 2                       // Chebyshev radius an explorer can see
const MIN_CHECK = SH + 'MinCountConstraintComponent'

// ───────── deterministic noise ─────────
const hash = (a, b, c) => {
  let h = Math.imul(a | 0, 374761393) ^ Math.imul(b | 0, 668265263) ^ Math.imul(c | 0, 2246822519)
  h = Math.imul(h ^ (h >>> 15), 2246822519); h = Math.imul(h ^ (h >>> 13), 3266489917); h ^= h >>> 16
  return (h >>> 0) / 4294967296
}
const vnoise = (x, y, s) => {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, sm = t => t * t * (3 - 2 * t)
  const a = hash(xi, yi, s), b = hash(xi + 1, yi, s), c = hash(xi, yi + 1, s), d = hash(xi + 1, yi + 1, s), u = sm(xf), v = sm(yf)
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v
}
const fbm = (x, y, s) => 0.55 * vnoise(x / 8, y / 8, s) + 0.3 * vnoise(x / 4, y / 4, s + 11) + 0.15 * vnoise(x / 2, y / 2, s + 23)

// ───────── lexicon: the words the world will teach ─────────
const TERRAINS = [

// ───────── workbench: the ladder of dormant stage modules ─────────

// ───────── an explorer ─────────

      <nav id="tabs"><button data-t="mind" class="on">Mind</button><button data-t="worldview">Worldview</button><button data-t="commons">Commons</button><button data-t="atlas">Atlas</button><button data-t="workbench">Workbench</button><button data-t="log">Log</button><button data-t="about">About</button></nav>
      <div class="tab" id="t-mind"></div>
      <div class="tab" id="t-worldview" hidden>
        <div class="bar"><span id="wvStatus"></span><span class="sp"></span>
          <select id="snip"><option value="">+ add a shape…</option>${Object.entries(SNIPPETS).map(([k, v]) => `<option value="${k}">${esc(v.title)}</option>`).join('')}</select>
          <button id="wvDl">Download</button></div>
        <mdld-editor id="wvEd" height="62svh"></mdld-editor>
        <p class="hint">This text <i>is</i> the explorer's worldview. Edit it — the next tick uses it. Append-only promotions add stage modules at the bottom; you may delete or rewrite anything.</p>
      </div>
      <div class="tab" id="t-commons" hidden>
        <div id="cmInfo"></div>
        <div class="bar"><span id="cmStatus"></span></div>
        <mdld-editor id="cmEd" height="30svh"></mdld-editor>
        <p class="hint">The Charter: what each viewpoint needs before it will settle. Edit a number — raise Bo's vitality to 5, say — and the council re-judges every site on its next beat.</p>
      </div>
      <div class="tab" id="t-atlas" hidden>
        <div class="bar"><span id="atStat"></span><span class="sp"></span><button id="atDl">Download atlas.md</button><button id="atTxt">Show canonical text</button></div>
        <quad-graph id="qg" height="330"></quad-graph>
        <pre id="atPre" hidden></pre>
        <p class="hint">Union of everything any explorer has admitted. The hub edges (atlas → defines / holds) and tile addresses are hidden here; the download is the full canonical MD-LD.</p>
      </div>
      <div class="tab" id="t-workbench" hidden>
        <div class="bar"><span id="wbStatus"></span><span class="sp"></span><label class="file">Load .md<input id="wbFile" type="file" accept=".md,.txt" hidden></label><button id="wbReset">Reset</button><button id="wbApply" class="pri">Apply &amp; restart</button></div>
        <mdld-editor id="wbEd" height="62svh"></mdld-editor>
        <p class="hint">workbench.md: the intention, the shell shapes and the dormant ladder of stage modules. Changing a gate or a stage here changes every future explorer.</p>
      </div>
      <div class="tab" id="t-log" hidden><div id="log"></div></div>
      <div class="tab" id="t-about" hidden>${aboutHTML()}</div>
    </section>
  </main>`

  function aboutHTML() {
    return `<div class="about"><h3>How the world thinks</h3>
    <ol><li><b>Reality</b> is a seeded, deterministic world nobody can see whole.</li>
    <li>An explorer's <b>worldview</b> is a set of SHACL shapes (MD-LD text). It is its only sense: a fact enters memory only if a shape <i>targets</i> the subject and <i>names</i> the predicate. No shape about places → places are scenery.</li>
    <li>Every tick the shapes are <code>evaluate()</code>d over memory. <b>Records</b> are what it perceives; <b>violations</b> are its tasks: <code>sh:minCount</code> means "go where the answer lives".</li>
    <li>A value the world <i>contradicts</i> is a <b>finding</b>, not a task. A value the world cannot give is a <b>blocked</b> task — the shape is wrong.</li>
    <li><b>Ontology first.</b> Stage 0 asks only for definitions. When an explorer's gate shape has enough <i>complete</i> records, the next stage module is appended to its worldview.</li>
    <li>Explorers within two tiles <b>exchange</b> memories — filtered through the receiver's lens.</li></ol>
    <p>Everything is deterministic: same workbench + same seed → same history. Try the “+ add a shape” menu in Worldview after the atlas goes quiet.</p></div>`
  }

  // ───────── lifecycle ─────────
  const wbEd = $('#wbEd'), wvEd = $('#wvEd'), cmEd = $('#cmEd')
  function restart(wbText, seed) {
    try {
      S.sim = createSim({ workbench: wbText, seed }); S.seed = seed; S.wbText = wbText; S.sel = 0; S.lastWV = ''; S.graphN = -1; if (S.sim.commons) cmEd.value = S.sim.commons.worldview
      S.sim.events.push({ tick: 0, text: `New world (seed ${seed}) · ${S.sim.agents.length} explorers · workbench shell ${S.sim.wb.shellViolations.length ? S.sim.wb.shellViolations.length + ' violation(s)' : 'clean'}`, kind: 'info' })
      $('#wbStatus').innerHTML = S.sim.wb.shellViolations.length ? `<b class="bad">✗ ${S.sim.wb.shellViolations.length} shell violation(s)</b>` : `<b class="ok">✓ shell clean</b> · ${S.sim.wb.stages.length} stages · ${S.sim.wb.agents.length} explorers`
      S.panelDirty = true; return true
    } catch (e) { $('#wbStatus').innerHTML = `<b class="bad">✗ ${esc(e.message)}</b>`; return false }
  }
  const selAgent = () => S.sim.agents[S.sel] || S.sim.agents[0]

  // ───────── canvas ─────────
  const cv = $('#cv'), ctx = cv.getContext('2d')
  function fitCanvas() { const { W, H } = S.sim.world, dpr = Math.min(2, window.devicePixelRatio || 1); cv.width = W * TS * dpr; cv.height = H * TS * dpr; cv.style.aspectRatio = `${W} / ${H}`; ctx.setTransform(dpr, 0, 0, dpr, 0, 0) }
  const shade = i => ((Math.imul(i, 2654435761) >>> 0) % 100) / 100 * 0.10
  function draw(now) {
    const sim = S.sim, { W, H, N, terr } = sim.world, a = selAgent(), agentView = S.view === 'mind'
    if (cv.width !== W * TS * Math.min(2, window.devicePixelRatio || 1)) fitCanvas()
    ctx.fillStyle = '#070a10'; ctx.fillRect(0, 0, W * TS, H * TS)
    const known = new Uint8Array(N); for (const g of sim.agents) for (let i = 0; i < N; i++) if (g.know[i] >= 0) known[i] = 1
    for (let i = 0; i < N; i++) {
      const x = i % W, y = (i / W) | 0, mine = a.know[i] >= 0
      if (!known[i]) { ctx.fillStyle = '#0b1019'; ctx.fillRect(x * TS, y * TS, TS, TS); continue }
      ctx.globalAlpha = agentView && !mine ? 0.32 : 1
      ctx.fillStyle = TERRAINS[terr[i]].color; ctx.fillRect(x * TS, y * TS, TS, TS)
      ctx.fillStyle = `rgba(0,0,0,${shade(i)})`; ctx.fillRect(x * TS, y * TS, TS, TS)
      ctx.globalAlpha = 1
    }
    // open obligations per feature, across all minds
    const open = new Map(), seenF = new Map()
    for (const g of sim.agents) {
      for (const f of g.atOf.keys()) { if (!seenF.has(f)) seenF.set(f, new Set()); seenF.get(f).add(g.id) }
      if (g.report && (!agentView || g === a)) for (const v of g.report.violations) if (v.component === MIN) open.set(v.focusNode, (open.get(v.focusNode) || 0) + 1)
    }
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'
    const pulse = 0.55 + 0.45 * Math.sin(now / 260)
    for (const [fid, by] of seenF) {
      const f = sim.world.byId.get(fid); if (!f) continue
      const k = KINDS.find(k => k.id === f.kind), cx = f.x * TS + TS / 2, cy = f.y * TS + TS / 2, mine = by.has(a.id)
      ctx.globalAlpha = agentView && !mine ? 0.35 : 1
      ctx.fillStyle = 'rgba(8,12,20,.72)'; ctx.beginPath(); ctx.arc(cx, cy, TS * 0.46, 0, 7); ctx.fill()
      const o = open.get(fid)
      ctx.lineWidth = 2; ctx.strokeStyle = o ? `rgba(242,177,52,${0.45 + 0.55 * pulse})` : '#5fd38d'; ctx.beginPath(); ctx.arc(cx, cy, TS * 0.46, 0, 7); ctx.stroke()
      ctx.font = `${Math.round(TS * 0.62)}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`; ctx.fillStyle = '#fff'; ctx.fillText(k.glyph, cx, cy + 1)
      ctx.globalAlpha = 1
    }
    // settlements are markets (3 tiles); a proposal pulses until the quorum arrives
    for (const t of sim.commons?.settlements || []) if (seenF.has(t.id)) { ctx.strokeStyle = 'rgba(255,224,130,.35)'; ctx.setLineDash([2, 4]); ctx.beginPath(); ctx.arc(t.at[0] * TS + TS / 2, t.at[1] * TS + TS / 2, 3.5 * TS, 0, 7); ctx.stroke(); ctx.setLineDash([]) }
    const pr = sim.commons?.proposal
    if (pr) { ctx.strokeStyle = `rgba(255,224,130,${0.4 + 0.6 * pulse})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(pr.at[0] * TS + TS / 2, pr.at[1] * TS + TS / 2, TS * (1.2 + 0.3 * pulse), 0, 7); ctx.stroke(); ctx.fillStyle = '#ffe082'; ctx.font = '600 11px system-ui,sans-serif'; ctx.fillText('founding?', pr.at[0] * TS + TS / 2, pr.at[1] * TS - 6) }
    // camp
    const cx0 = (sim.world.camp % W) * TS + TS / 2, cy0 = ((sim.world.camp / W) | 0) * TS + TS / 2
    ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.setLineDash([3, 3]); ctx.strokeRect(cx0 - TS / 2, cy0 - TS / 2, TS, TS); ctx.setLineDash([])
    // exchanges
    for (const e of sim.exchanges.slice(-12)) {
      const age = sim.tick - e.tick; if (age > 8) continue
      const A = sim.agents.find(g => g.id === e.a), B = sim.agents.find(g => g.id === e.b)
      ctx.strokeStyle = `rgba(255,224,130,${1 - age / 8})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(A.x * TS + TS / 2, A.y * TS + TS / 2); ctx.lineTo(B.x * TS + TS / 2, B.y * TS + TS / 2); ctx.stroke()
    }
    // paths + sight + agents
    for (const g of sim.agents) {
      const isSel = g === a
      if (g.path.length) {
        ctx.strokeStyle = g.color; ctx.globalAlpha = isSel ? 0.9 : 0.28; ctx.lineWidth = isSel ? 2 : 1; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.moveTo(g.x * TS + TS / 2, g.y * TS + TS / 2)
        for (const i of g.path) ctx.lineTo((i % W) * TS + TS / 2, ((i / W) | 0) * TS + TS / 2); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1
        const t = g.path[g.path.length - 1]; ctx.strokeStyle = g.color; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc((t % W) * TS + TS / 2, ((t / W) | 0) * TS + TS / 2, TS * 0.32, 0, 7); ctx.stroke()
      }
    }
    ctx.strokeStyle = a.color; ctx.globalAlpha = 0.5; ctx.lineWidth = 1; ctx.strokeRect((a.x - 2) * TS, (a.y - 2) * TS, 5 * TS, 5 * TS); ctx.globalAlpha = 1
    for (const g of sim.agents) {
      const cx = g.x * TS + TS / 2, cy = g.y * TS + TS / 2, isSel = g === a
      if (isSel) { ctx.fillStyle = g.color + '44'; ctx.beginPath(); ctx.arc(cx, cy, TS * 0.95, 0, 7); ctx.fill() }
      ctx.fillStyle = g.color; ctx.strokeStyle = '#0a0e16'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, TS * 0.36, 0, 7); ctx.fill(); ctx.stroke()
      ctx.fillStyle = '#0a0e16'; ctx.font = `700 ${Math.round(TS * 0.46)}px system-ui,sans-serif`; ctx.fillText(g.name[0], cx, cy + 1)
    }
    if (S.hover) { const [hx, hy] = S.hover; ctx.strokeStyle = '#fff'; ctx.globalAlpha = 0.7; ctx.lineWidth = 1; ctx.strokeRect(hx * TS + .5, hy * TS + .5, TS - 1, TS - 1); ctx.globalAlpha = 1 }
  }
  function tileAt(ev) { const r = cv.getBoundingClientRect(), { W, H } = S.sim.world, x = Math.floor((ev.clientX - r.left) / r.width * W), y = Math.floor((ev.clientY - r.top) / r.height * H); return x >= 0 && y >= 0 && x < W && y < H ? [x, y] : null }
  cv.addEventListener('mousemove', e => { S.hover = tileAt(e); tip() })
  cv.addEventListener('mouseleave', () => { S.hover = null; tip() })
  cv.addEventListener('click', e => { const t = tileAt(e); if (!t) return; let best = -1, bd = 3; S.sim.agents.forEach((g, i) => { const d = Math.max(Math.abs(g.x - t[0]), Math.abs(g.y - t[1])); if (d < bd) { bd = d; best = i } }); if (best >= 0) { S.sel = best; S.panelDirty = true; renderAgents() } })
  function tip() {
    const el = $('#tip'); if (!S.hover) { el.textContent = ''; return }
    const [x, y] = S.hover, { W } = S.sim.world, i = y * W + x, who = S.sim.agents.filter(g => g.know[i] >= 0).map(g => g.name)
    if (!who.length) { el.innerHTML = `<b>${x},${y}</b> · unexplored`; return }
    const f = S.sim.world.featAt(i), k = f && KINDS.find(k => k.id === f.kind)
    el.innerHTML = `<b>${x},${y}</b> · ${TERRAINS[S.sim.world.terr[i]].label}${f ? ` · ${k.glyph} ${k.label}` : ''} · seen by ${who.join(', ')}`
  }

  // ───────── panels ─────────
  function renderChips() {
    const s = stats(S.sim), shell = S.sim.wb.shellViolations.length
    $('#chips').innerHTML = [
      ['tick', s.tick], ['settlements', s.settlements, s.settlements ? 'green' : ''], ['mapped', (s.mapped * 100).toFixed(0) + '%'], ['words', s.classes], ['places', `${s.features}/${s.totalFeatures}`],
      ['open tasks', s.open, s.open ? 'amber' : 'green'], ['shell', shell ? shell + ' ✗' : '✓', shell ? 'red' : '']].map(([k, v, c]) => `<span class="chip ${c || ''}"><i>${k}</i>${v}</span>`).join('')
  }
  function renderAgents() {
    $('#agents').innerHTML = S.sim.agents.map((a, i) => {
      const gate = a.stageGate, c = gate && a.report ? completeCount(a.report, gate.gate) : 0, open = a.report ? a.report.violations.filter(v => v.component === MIN).length : 0
      return `<button class="ag ${i === S.sel ? 'on' : ''}" data-i="${i}" style="--c:${a.color}"><span class="dot"></span><b>${esc(a.name)}</b><em>${esc(a.roleName)}</em>
        <span class="pips">${[0, 1, 2, 3].map(k => `<i class="${k <= a.stage ? 'f' : ''}"></i>`).join('')}</span>
        <small>${a.task ? (a.task.explore ? '🧭 exploring' : a.task.found ? '🏘️ gathering to found' : a.task.request ? '📏 ' + esc(a.task.message.replace('Council request: ', 'council: ')) : '→ ' + esc(short(a.task.focus).replace('w:', '')) + ' · ' + esc(short(a.task.path).replace(/^(w:|rdfs:)/, ''))) : '· idle'} <u>${open} open</u></small></button>`
    }).join('')
    $$('#agents .ag').forEach(b => b.onclick = () => { S.sel = +b.dataset.i; S.panelDirty = true; renderAgents() })
  }
  function renderLegend() {
    $('#legend').innerHTML = `<span><i class="ring amber"></i> place with an open task</span><span><i class="ring green"></i> place no mind is missing anything about</span><span><i class="dashed"></i> intended route</span><span><i class="gold"></i> memory exchange</span>`
  }
  function mindHTML() {
    const sim = S.sim, a = selAgent(), rep = a.report; if (!rep) return '<p class="hint">…</p>'
    const gate = a.stageGate, gc = gate ? completeCount(rep, gate.gate) : 0, last = a.stage + 1 >= sim.wb.stages.length
    const ladder = sim.wb.stages.map((_, k) => { const st = stageFor(sim.wb, k, a.role); return `<li class="${k < a.stage ? 'done' : k === a.stage ? 'now' : ''}"><i>${k}</i>${esc(st ? st.label : '')}</li>` }).join('')
    const tasks = [], seen = new Set()
    for (const v of rep.violations) { if (v.component !== MIN) continue; const key = v.focusNode + '|' + v.path; if (seen.has(key)) continue; seen.add(key); tasks.push({ v, rank: sim.wb.pathRank.get(v.path) ?? 0.5, blocked: a.blocked.has(key), cur: a.task && a.task.key === key }) }
    tasks.sort((p, q) => p.rank - q.rank || (p.v.focusNode < q.v.focusNode ? -1 : 1))
    const shapes = shapeStats(a)
    const recs = shapes.filter(s => s.partial).map(s => { const nodes = Object.entries(rep.records[s.iri] || {}).filter(([, p]) => Object.keys(p).length).slice(0, 3)
      return `<details><summary><b>${esc(s.name.replace('w:', ''))}</b> <em>${s.complete} complete · ${s.open} open</em></summary>${nodes.map(([n, p]) => `<div class="rec"><code>${esc(short(n))}</code>${recordTable(p)}</div>`).join('') || '<p class="hint">nothing perceived yet</p>'}</details>` }).join('')
    return `
    <div class="mh" style="--c:${a.color}"><span class="dot"></span><h2>${esc(a.name)}</h2><em>${esc(a.roleName)} · at ${a.x},${a.y}</em></div>
    <ol class="ladder">${ladder}</ol>
    <p class="gate">${gate ? `Gate to stage ${a.stage + 1}: <b>${esc(short(gate.gate).replace('w:', ''))}</b> ${gc}/${gate.gateRecords} complete records ${last ? '· <i>final stage — the shapes are yours now</i>' : ''}` : ''}</p>
    <h4>Now</h4><p class="now">${a.task ? (a.task.explore ? `🧭 <b>exploring</b> — ${esc(a.task.message)}` : `🎯 <b>${esc(a.task.message.replace(/ — .*$/, ''))}</b> <code>${esc(short(a.task.focus))}</code> → tile ${a.task.target % sim.world.W},${(a.task.target / sim.world.W) | 0}`) : (tasks.length ? 'waiting…' : '✓ no open violations — the worldview is satisfied')}</p>
    <h4>Shapes <em>${shapes.length}</em></h4>
    <table class="tbl"><tr><th>shape</th><th>complete</th><th>partial</th><th>open</th></tr>${shapes.map(s => `<tr><td>${esc(s.name.replace('w:', ''))}</td><td>${s.complete}</td><td>${s.partial}</td><td class="${s.open ? 'amber' : ''}">${s.open}</td></tr>`).join('')}</table>
    <h4>Tasks <em>${tasks.length} open violations</em></h4>
    <ul class="tasks">${tasks.slice(0, 24).map(t => `<li class="${t.cur ? 'cur' : ''} ${t.blocked ? 'blk' : ''}"><i>s${t.rank === 0.5 ? '★' : t.rank}</i>${esc(t.v.message.replace(/ — .*$/, ''))} <code>${esc(short(t.v.focusNode).replace('w:', ''))}</code>${t.blocked ? ' <b>blocked</b>' : ''}</li>`).join('') || '<li class="hint">none</li>'}${tasks.length > 24 ? `<li class="hint">… ${tasks.length - 24} more</li>` : ''}</ul>
    ${a.findings?.length ? `<h4>Findings <em>the world disagrees with the shape</em></h4><ul class="tasks">${a.findings.slice(0, 8).map(v => `<li class="fnd"><i>≠</i>${esc(v.message.replace(/ — .*$/, ''))} <code>${esc(short(v.focusNode).replace('w:', ''))}</code> value <b>${esc(v.value)}</b> · ${esc(v.component.split('#').pop().replace('ConstraintComponent', ''))}</li>`).join('')}${a.findings.length > 8 ? `<li class="hint">… ${a.findings.length - 8} more</li>` : ''}</ul>` : ''}
    ${a.blocked.size ? `<h4>Blocked <em>edit the shape, not the explorer</em></h4><p class="hint">${[...a.blocked].slice(0, 6).map(k => esc(k.split('|').map(short).join(' · '))).join('<br>')}${a.blocked.size > 6 ? `<br>… ${a.blocked.size - 6} more` : ''}</p>` : ''}
    <h4>Perception <em>evaluated records (only what conforms)</em></h4>${recs || '<p class="hint">nothing yet</p>'}`
  }
  function commonsHTML() {
    const cm = S.sim.commons; if (!cm) return '<p class="hint">This workbench has no Charter.</p>'
    const pr = cm.proposal, rows = cm.sites.slice().sort((p, q) => ({ viable: 0, pending: 1, unfit: 2 }[p.status] - { viable: 0, pending: 1, unfit: 2 }[q.status]) || (p.id < q.id ? -1 : 1))
    return `${pr ? `<p class="now">📣 <b>Proposal</b> at <code>${esc(short(pr.site.water.id))}</code> — ${S.sim.agents.filter(a => Math.max(Math.abs(a.x - pr.at[0]), Math.abs(a.y - pr.at[1])) <= 2).length}/${cm.quorum} explorers present</p>` : '<p class="hint">No proposal. The commons waits for a site every viewpoint accepts.</p>'}
    <h4>Settlements <em>${cm.settlements.length}/${cm.max} · spacing ${cm.spacing}</em></h4>
    <ul class="tasks">${cm.settlements.map(t => `<li><i>t${t.tick}</i>🏘️ ${t.at.join(',')} beside <code>${esc(short(t.water))}</code> — founded by ${esc(t.founders.join(', '))}</li>`).join('') || '<li class="hint">none yet</li>'}</ul>
    <h4>Candidate sites <em>${rows.length} joined from everyone's memory</em></h4>
    <table class="tbl"><tr><th>site</th><th>verdict</th><th>why</th></tr>${rows.slice(0, 18).map(x => `<tr><td><code>${esc(short(x.water.id).replace('w:f-', ''))}</code></td><td class="${x.status === 'viable' ? 'ok' : x.status === 'unfit' ? 'bad' : 'amber'}">${x.status}</td><td>${esc(x.reasons.join('; ') || 'every viewpoint satisfied')}</td></tr>`).join('')}</table>`
  }
  function renderLog() {
    $('#log').innerHTML = S.sim.events.slice(-120).reverse().map(e => `<div class="ev ${e.kind}"><i>${e.tick}</i>${esc(e.text)}</div>`).join('')
  }
  function renderWorldview(force) {
    const a = selAgent(), ed = wvEd
    if ((force || a.worldview !== S.lastWV) && (force || document.activeElement !== ed)) { ed.value = a.worldview; S.lastWV = a.worldview }
    $('#wvStatus').innerHTML = a.shError ? `<b class="bad">✗ ${esc(a.shError)}</b>` : `<b class="ok">✓ ${a.sh.quads.length} quads</b> · ${a.sh.shapes.length} shapes · lens: ${a.sh.paths.size} predicates`
  }
  function renderAtlas() {
    const sim = S.sim, quads = unionQuads(sim), s = stats(sim)
    $('#atStat').textContent = `${quads.length} quads · ${s.classes} words · ${s.features} places`
    if (quads.length !== S.graphN && performance.now() - S.graphT > 1200) {
      const qg = $('#qg'), keep = quads.filter(q => { const p = q.predicate.value, s = q.subject.value; if (s === NS + 'atlas') return false; if (p === NS + 'at') return false; if (p === 'http://www.w3.org/1999/02/22-rdf-syntax-ns#type') { const o = q.object.value; return o !== NS + 'Feature' && !['Natural', 'Mineral', 'Relic', 'Civic'].some(g => o === NS + g) } return true })
      if (qg) { qg.context = { w: NS, rdf: 'http://www.w3.org/1999/02/22-rdf-syntax-ns#', rdfs: 'http://www.w3.org/2000/01/rdf-schema#', xsd: 'http://www.w3.org/2001/XMLSchema#' }; qg.quads = keep }
      S.graphN = quads.length; S.graphT = performance.now()
    }
  }
  function renderPanel() {
    S.panelDirty = false; renderChips(); renderAgents()
    if (S.tab === 'mind') $('#t-mind').innerHTML = mindHTML()
    else if (S.tab === 'worldview') renderWorldview(false)
    else if (S.tab === 'commons') { $('#cmInfo').innerHTML = commonsHTML(); const cm = S.sim.commons; if (cm) $('#cmStatus').innerHTML = cm.error ? `<b class="bad">✗ ${esc(cm.error)}</b>` : `<b class="ok">✓ Charter</b> · ${cm.sh.quads.length} quads` }
    else if (S.tab === 'atlas') renderAtlas()
    else if (S.tab === 'log') renderLog()
  }

  // ───────── controls ─────────
  const setTab = t => { S.tab = t; $$('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === t)); $$('.tab').forEach(d => d.hidden = d.id !== 't-' + t); if (t === 'worldview') renderWorldview(true); if (t === 'commons' && S.sim.commons && cmEd.value !== S.sim.commons.worldview && document.activeElement !== cmEd) cmEd.value = S.sim.commons.worldview; if (t === 'atlas') S.graphT = 0; S.panelDirty = true }
  $$('#tabs button').forEach(b => b.onclick = () => setTab(b.dataset.t))
  const setPlay = on => { S.playing = on; $('#play').textContent = on ? '⏸ Pause' : '▶ Run' }
  $('#play').onclick = () => setPlay(!S.playing)
  $('#step').onclick = () => { setPlay(false); step(S.sim); S.panelDirty = true }
  $('#speed').onchange = e => S.speed = +e.target.value
  $('#newworld').onclick = () => { setPlay(false); restart(S.wbText, +$('#seed').value || 1); setTab(S.tab) }
  $('#vAtlas').onclick = () => { S.view = 'atlas'; $('#vAtlas').classList.add('on'); $('#vMind').classList.remove('on') }
  $('#vMind').onclick = () => { S.view = 'mind'; $('#vMind').classList.add('on'); $('#vAtlas').classList.remove('on') }
  window.addEventListener('keydown', e => { if (e.code === 'Space' && !/^(INPUT|TEXTAREA|SELECT|MDLD-EDITOR)$/.test(document.activeElement?.tagName || '')) { e.preventDefault(); setPlay(!S.playing) } })
  let wvT; wvEd.addEventListener('input', () => { clearTimeout(wvT); wvT = setTimeout(() => { const a = selAgent(); setWorldview(S.sim, a, wvEd.value); S.lastWV = a.worldview !== wvEd.value && a.shError ? S.lastWV : wvEd.value; if (!a.shError) a.edited = true; S.sim.events.push({ tick: S.sim.tick, text: a.shError ? `${a.name}'s worldview did not parse — keeping the previous shapes` : `${a.name}'s worldview edited (${a.sh.shapes.length} shapes, ${a.sh.paths.size} predicates in lens)`, kind: a.shError ? 'blocked' : 'edit' }); renderWorldview(false); S.panelDirty = true }, 350) })
  let cmT; cmEd.addEventListener('input', () => { clearTimeout(cmT); cmT = setTimeout(() => { const ok = setCharter(S.sim, cmEd.value); S.sim.events.push({ tick: S.sim.tick, text: ok ? 'Charter edited — the council will re-judge every site' : 'Charter did not parse — keeping the previous one', kind: ok ? 'council' : 'blocked' }); S.panelDirty = true }, 350) })
  $('#snip').onchange = e => { const sn = SNIPPETS[e.target.value]; if (!sn) return; const a = selAgent(); const text = a.worldview.trimEnd() + '\n' + sn.text; if (setWorldview(S.sim, a, text)) { S.sim.events.push({ tick: S.sim.tick, text: `${a.name}: added “${sn.title}”`, kind: 'edit' }); renderWorldview(true) } e.target.value = ''; S.panelDirty = true }
  $('#wvDl').onclick = () => download(`${selAgent().id}-worldview.md`, selAgent().worldview)
  $('#atDl').onclick = () => download('atlas.md', generate({ quads: unionQuads(S.sim), context: { w: NS } }).text)
  $('#atTxt').onclick = () => { const p = $('#atPre'); p.hidden = !p.hidden; if (!p.hidden) { const t = generate({ quads: unionQuads(S.sim), context: { w: NS } }).text; p.textContent = t.length > 14000 ? t.slice(0, 14000) + '\n… (' + t.length + ' chars — download for all)' : t } }
  $('#wbApply').onclick = () => { setPlay(false); if (restart(wbEd.value, +$('#seed').value || S.seed)) setTab('mind') }
  $('#wbReset').onclick = () => { wbEd.value = BASE_WB }
  $('#wbFile').onchange = async e => { const f = e.target.files[0]; if (f) wbEd.value = await f.text() }
  $('#t-workbench label.file').onclick = () => $('#wbFile').click()
  function download(name, text) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/markdown' })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 500) }

  // ───────── boot ─────────
  restart(BASE_WB, 3); wbEd.value = BASE_WB; fitCanvas(); renderLegend(); renderPanel()
  let prev = performance.now()
  const frame = now => {
    const dt = Math.min(0.2, (now - prev) / 1000); prev = now
    if (S.playing) { S.acc += dt * S.speed; let n = 0; while (S.acc >= 1 && n < 6) { step(S.sim); S.acc -= 1; n++; S.panelDirty = true } if (S.acc > 6) S.acc = 0 }
    draw(now)
    if (S.panelDirty && now - S.lastPanel > 220) { S.lastPanel = now; renderPanel() }
    requestAnimationFrame(frame)
  }
  requestAnimationFrame(frame)
  window.__atlas = { S, step, restart }
}

</script></body></html>
